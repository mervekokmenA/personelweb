name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "APK'nın içinde açılacak canlı site adresi (boş bırakılırsa CAPACITOR_SERVER_URL repo değişkeni kullanılır)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor (Android) with live site URL
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.CAPACITOR_SERVER_URL }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" kisisel-panel.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kisisel-panel-apk
          path: kisisel-panel.apk
          retention-days: 30

      - name: Publish/refresh "latest" release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Kişisel Panel APK (otomatik)"
          body: |
            Bu APK, Ayarlar sayfasındaki "APK Oluştur" butonuyla otomatik derlenmiştir.
            İçeride sabit veri yoktur — açılışta her zaman canlı siteyi (${{ inputs.server_url || vars.CAPACITOR_SERVER_URL }}) yükler.

            Derleme zamanı: ${{ github.run_id }} — ${{ github.event.repository.updated_at }}
          files: kisisel-panel.apk
          prerelease: true
